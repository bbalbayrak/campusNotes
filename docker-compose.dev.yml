version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: campus-notes-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8080

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: admin
      DB_NAME_DEVELOPMENT: campus_notes
      DB_DIALECT: postgres

      # Redis (⚠️ BURASI KRİTİK)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: campus-notes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: campus_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: campus-notes-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres-data:
